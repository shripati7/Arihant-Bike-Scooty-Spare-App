name: spare_app
description: SupplyHub
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.5+1

  # URL Launcher
  url_launcher: ^6.3.1

  # Banner Slider
  carousel_slider: ^5.1.1

  # Firebase
  firebase_core: ^3.15.1
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.11
  firebase_storage: ^12.4.9

  # Image Picker
  image_picker: ^1.1.2

  # Image Cache (Performance)
  cached_network_image: ^3.4.1

  # Image Compression (Performance)
  flutter_image_compress: ^2.4.0

  # PDF Invoice
  pdf: ^3.11.3
  printing: ^5.14.2
  path_provider: ^2.1.5
  share_plus: ^11.1.0

  # Date Formatting
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-VariableFont_wdth,wght.ttf
        